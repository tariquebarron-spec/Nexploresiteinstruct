<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexplore Fall Placements — TX/FL/GA Live Sites Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --panel2: #1d2540;
    --border: #2a3450;
    --text: #e8ecf5;
    --muted: #93a0bf;
    --accent: #4f8cff;
    --open: #ff6b5e;
    --filled: #37c977;
    --mix: #ffb545;
    --instructor: #4fd1ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #141a2c, #0f1420);
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .stats {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
  }
  .stat b { font-size: 16px; display:block; }
  .stat.open b { color: var(--open); }
  .stat.filled b { color: var(--filled); }
  .stat.sites b { color: var(--accent); }
  .stat.regions b { color: var(--mix); }
  .stat.instructor b { color: var(--instructor); }

  #map {
    height: 560px;
    width: 100%;
    border-bottom: 1px solid var(--border);
  }
  .legend {
    padding: 10px 28px;
    background: var(--panel);
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .legend .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .legend .dot.open { background: var(--open); }
  .legend .dot.mix { background: var(--mix); }
  .legend .dot.filled { background: var(--filled); }
  .legend .dot.instructor { background: var(--instructor); }

  .controls {
    padding: 14px 28px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .controls input, .controls select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
  }
  .controls input { flex: 1; min-width: 180px; }

  main { padding: 8px 28px 40px; }
  .region-block {
    margin-top: 26px;
  }
  .region-title {
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: baseline;
    gap: 10px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
  .region-title .state-tag {
    font-size: 11px;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    padding: 2px 8px;
    border-radius: 6px;
  }
  .region-title .count {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }
  .site-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .site-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    position: relative;
  }
  .site-card.no-open { opacity: 0.55; }
  .site-name {
    font-weight: 700;
    font-size: 14.5px;
    margin-bottom: 2px;
  }
  .site-loc {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 10px;
  }
  .class-row {
    font-size: 12.5px;
    padding: 5px 0;
    border-top: 1px dashed var(--border);
  }
  .class-row:first-of-type { border-top: none; }
  .class-row .prog { font-weight: 600; }
  .class-row.filled { color: var(--muted); }
  .badge {
    display:inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 5px;
    margin-left: 6px;
  }
  .badge.open { background: rgba(255,107,94,0.18); color: var(--open); }
  .badge.filled { background: rgba(55,201,119,0.18); color: var(--filled); }
  .no-open-note { font-size: 12px; color: var(--muted); font-style: italic; }
  .filled-hover-wrap .hint { text-decoration: underline dotted; color: var(--muted); font-size: 10.5px; margin-left: 4px; }
  .filled-details {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 30;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 4px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  .filled-hover-wrap:hover .filled-details { display: block; }
  .filled-detail-row { font-size: 11.5px; padding: 4px 0; border-top: 1px dashed var(--border); }
  .filled-detail-row:first-child { border-top: none; }
  .maplibregl-popup-content { background: var(--panel); color: var(--text); border-radius: 10px; padding: 12px 14px; }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important; border-bottom-color: var(--panel) !important; }
  .maplibregl-popup-close-button { color: var(--muted); font-size: 16px; }
  .maplibregl-ctrl-attrib { background: rgba(15,20,32,0.7) !important; color: var(--muted) !important; }
  .maplibregl-ctrl-attrib a { color: var(--muted) !important; }
  .site-marker { width:16px; height:16px; border-radius:50%; border:1.5px solid #0f1420; cursor:pointer; box-shadow: 0 0 0 1px rgba(0,0,0,0.3); }
  .instructor-marker { width:10px; height:10px; border-radius:50%; border:1px solid #0f1420; background:#4fd1ff; opacity:0.85; cursor:pointer; }
  .style-toggle-ctrl button { width:29px; height:29px; font-size:15px; background:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .style-toggle-ctrl button:hover { background:#f2f2f2; }
  .popup-title { font-weight:700; font-size:13px; margin-bottom:2px; }
  .popup-addr { font-size:11px; color: var(--muted); margin-bottom:6px; }
  .popup-class { font-size:11.5px; padding:2px 0; }

  .addr-search-wrap { position: relative; margin-left: auto; display:flex; align-items:center; gap:6px; }
  .addr-search-wrap input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    width: 220px;
  }
  .addr-search-wrap button {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 6.5px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .addr-search-wrap button:hover { opacity: 0.9; }
  .addr-search-wrap button:disabled { opacity: 0.6; cursor: default; }
  .addr-search-status {
    position: absolute;
    top: 100%;
    right: 0;
    left: 0;
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }
  .addr-search-status.error { color: var(--open); }
  .address-marker { font-size: 28px; line-height: 1; cursor: pointer; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
  .combo-search-wrap { position: relative; margin-left: 10px; }
  .combo-search-wrap input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    width: 260px;
  }
  .combo-results {
    position: absolute;
    top: 100%;
    right: 0;
    left: 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 4px;
    max-height: 300px;
    overflow-y: auto;
    z-index: 50;
    display: none;
  }
  .combo-results.open { display: block; }
  .combo-result-item {
    padding: 7px 10px;
    font-size: 12.5px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .combo-result-item:last-child { border-bottom: none; }
  .combo-result-item:hover { background: var(--panel); }
  .combo-result-item b { flex: 1; }
  .combo-tag {
    font-size: 9.5px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .combo-tag.site { background: rgba(79,140,255,0.2); color: var(--accent); }
  .combo-tag.instructor { background: rgba(79,209,255,0.2); color: var(--instructor); }
  .combo-result-empty { padding: 8px 10px; font-size: 12px; color: var(--muted); }
</style>
</head>

<header>
  <h1>Nexplore Fall Placements — Live Site Map (TX / FL / GA)</h1>
  <p>Pulled live from the sandbox placement system · Auto-updated daily</p>
  <div class="stats">
    <div class="stat sites"><b>54</b>sites</div>
    <div class="stat regions"><b>27</b>regions</div>
    <div class="stat open"><b>108</b>open placements</div>
    <div class="stat filled"><b>67</b>filled classes</div>
    <div class="stat instructor"><b>295</b>instructors nearby</div>
  </div>
</header>

<div id="map"></div>
<div class="legend">
  <span><span class="dot open"></span>Has open placement(s)</span>
  <span><span class="dot mix"></span>Mixed program (some open)</span>
  <span><span class="dot filled"></span>Fully staffed</span>
  <span><span class="dot instructor"></span>Instructor (approx. by zip)</span>
  <div class="addr-search-wrap">
    <input type="text" id="addressSearch" placeholder="Search any address..." onkeydown="if(event.key==='Enter'){event.preventDefault();runAddressSearch();}">
    <button type="button" id="addressSearchBtn" onclick="runAddressSearch()">Go</button>
    <div class="addr-search-status" id="addrSearchStatus"></div>
  </div>
  <div class="combo-search-wrap">
    <input type="text" id="comboSearch" placeholder="Find a site or instructor..." oninput="comboSearchRun()" onfocus="comboSearchRun()">
    <div class="combo-results" id="comboResults"></div>
  </div>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="toggleInstructors" checked onchange="toggleInstructorLayer()">
 Show instructors
  </label>
</div>

<div class="controls">
  <input id="searchBox" type="text" placeholder="Search by site, city, program, or region..." oninput="renderList()">
  <select id="stateFilter" onchange="renderList()">
    <option value="">All States</option>
    <option value="TX">Texas</option>
    <option value="FL">Florida</option>
    <option value="GA">Georgia</option>
  </select>
  <select id="statusFilter" onchange="renderList()">
    <option value="">All Sites</option>
    <option value="open">Only sites with open placements</option>
    <option value="filled">Only fully-staffed sites</option>
  </select>
</div>

<main id="mainList"></main>

function siteHasOpen(s){ return s.classes.some(c => c.status === 'open'); }
function siteAllFilled(s){ return s.classes.every(c => c.status === 'filled'); }

// ---- MAP ----
const OFM_STYLES = {
  light: 'https://tiles.openfreemap.org/styles/bright',
  dark: 'https://tiles.openfreemap.org/styles/dark'
};
let currentStyleKey = 'light';

const map = new maplibregl.Map({
  container: 'map',
  style: OFM_STYLES[currentStyleKey],
  center: [-90, 29.5],
  zoom: 5
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');

class StyleToggleControl {
  onAdd(mapInstance) {
    this._map = mapInstance;
    this._container = document.createElement('div');
    this._container.className = 'maplibregl-ctrl maplibregl-ctrl-group style-toggle-ctrl';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.title = 'Switch light / dark map style';
    btn.textContent = currentStyleKey === 'light' ? '🌙' : '☀️';
    btn.addEventListener('click', () => {
      currentStyleKey = currentStyleKey === 'light' ? 'dark' : 'light';
      btn.textContent = currentStyleKey === 'light' ? '🌙' : '☀️';
      mapInstance.setStyle(OFM_STYLES[currentStyleKey]);
    });
    this._container.appendChild(btn);
    return this._container;
  }
  onRemove() {
    this._container.parentNode.removeChild(this._container);
    this._map = undefined;
  }
}
map.addControl(new StyleToggleControl(), 'bottom-right');

// Deep-zoom detail overlay: OpenFreeMap's public vector tiles cap at zoom 14, so past that
// point they just scale up rather than adding new detail. To match Leaflet's dense
// business/school labeling when fully zoomed in, layer the classic OSM raster tiles on
// top starting at zoom 15 (re-added after every style switch since setStyle clears layers).
function addDetailOverlay() {
  if (map.getSource('osm-raster')) return;
  map.addSource('osm-raster', {
    type: 'raster',
    tiles: [
      'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
      'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
      'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
    ],
    tileSize: 256,
    maxzoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  });
  map.addLayer({
    id: 'osm-raster-detail',
    type: 'raster',
    source: 'osm-raster',
    minzoom: 12,
    paint: { 'raster-opacity': 1 }
  });
}
map.on('style.load', addDetailOverlay);

const bounds = new maplibregl.LngLatBounds();
const siteMarkers = [];
DATA.forEach(s => {
  const openCount = s.classes.filter(c => c.status === 'open').length;
  const filledCount = s.classes.length - openCount;
  let color = '#37c977';
  if (openCount > 0 && filledCount > 0) color = '#ffb545';
  else if (openCount > 0) color = '#ff6b5e';

  const el = document.createElement('div');
  el.className = 'site-marker';
  el.style.background = color;

  let popupHtml = `<div class="popup-title">${s.name}</div>`;
  popupHtml += `<div class="popup-addr">${s.address}, ${s.city}, ${s.state} ${s.zip} &middot; ${s.region}</div>`;
  s.classes.forEach(c => {
    const statusTxt = c.status === 'open'
      ? '<span style="color:#ff6b5e;font-weight:700;">OPEN</span>'
      : `<span style="color:#37c977;">${c.instructor || 'Filled'}</span>`;
    const timeTxt = c.time ? ` <span style="color:var(--muted);">(${c.time})</span>` : '';
    const startTxt = c.startDate ? ` <span style="color:var(--muted);">· starts ${c.startDate}</span>` : '';
    popupHtml += `<div class="popup-class"><b>${c.program}</b>${c.course ? ' — ' + c.course : ''}${timeTxt}${startTxt} · ${statusTxt}</div>`;
  });

  const popup = new maplibregl.Popup({ maxWidth: '320px', offset: 14, closeButton: false }).setHTML(popupHtml);
  const marker = new maplibregl.Marker({ element: el }).setLngLat([s.lon, s.lat]).setPopup(popup).addTo(map);

  let hoverCloseTimer = null;
  function cancelSiteClose(){ if (hoverCloseTimer) { clearTimeout(hoverCloseTimer); hoverCloseTimer = null; } }
  function scheduleSiteClose(){ hoverCloseTimer = setTimeout(() => { if (popup.isOpen()) marker.togglePopup(); }, 200); }
  el.addEventListener('mouseenter', () => { cancelSiteClose(); if (!popup.isOpen()) marker.togglePopup(); });
  el.addEventListener('mouseleave', scheduleSiteClose);
  popup.on('open', () => {
    const popupEl = popup.getElement();
    if (popupEl) {
      popupEl.addEventListener('mouseenter', cancelSiteClose);
      popupEl.addEventListener('mouseleave', scheduleSiteClose);
    }
  });

  bounds.extend([s.lon, s.lat]);
  siteMarkers.push(marker);
});

const instructorMarkers = [];
INSTRUCTORS.forEach(ins => {
  const el = document.createElement('div');
  el.className = 'instructor-marker';

  const popup = new maplibregl.Popup({ maxWidth: '280px', offset: 10 }).setHTML(
    '<div class="popup-title">🧑 ' + ins.name + '</div><div class="popup-addr">' + ins.region + ', ' + ins.state + ' · zip ' + ins.zip + ' (approximate)</div>'
  );
  const marker = new maplibregl.Marker({ element: el }).setLngLat([ins.lon, ins.lat]).setPopup(popup).addTo(map);
  instructorMarkers.push(marker);
});

// ---- ADDRESS SEARCH ----
let addressMarker = null;
async function runAddressSearch(){
  const input = document.getElementById('addressSearch');
  const btn = document.getElementById('addressSearchBtn');
  const status = document.getElementById('addrSearchStatus');
  const q = input.value.trim();
  status.textContent = '';
  status.classList.remove('error');
  if (!q) return;

  btn.disabled = true;
  btn.textContent = '...';
  status.textContent = 'Searching…';

  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 8000);
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q);
    const res = await fetch(url, { signal: ctrl.signal, headers: { 'Accept-Language': 'en' } });
    clearTimeout(timeout);
    const results = await res.json();

    if (!results || results.length === 0) {
      status.textContent = 'No results found for “' + q + '”';
      status.classList.add('error');
      return;
    }

    const r = results[0];
    const lat = parseFloat(r.lat);
    const lon = parseFloat(r.lon);

    if (addressMarker) addressMarker.remove();

    const el = document.createElement('div');
    el.className = 'address-marker';
    el.textContent = '📍';

    const popup = new maplibregl.Popup({ maxWidth: '280px', offset: 24 }).setHTML(
      '<div class="popup-title">Searched location</div><div class="popup-addr">' + r.display_name + '</div>'
    );

    addressMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([lon, lat]).setPopup(popup).addTo(map);
    map.flyTo({ center: [lon, lat], zoom: 16, essential: true });
    addressMarker.togglePopup();
    status.textContent = '';
  } catch (e) {
    status.textContent = 'Search failed — try again';
    status.classList.add('error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Go';
  }
}

function comboSearchRun(){
  const box = document.getElementById('comboSearch');
  const resultsEl = document.getElementById('comboResults');
  const q = box.value.trim().toLowerCase();
  if (!q) { resultsEl.classList.remove('open'); resultsEl.innerHTML = ''; return; }

  const siteMatches = [];
  DATA.forEach((s, idx) => {
    const hay = (s.name + ' ' + s.city + ' ' + s.region + ' ' + s.state).toLowerCase();
    if (hay.includes(q)) siteMatches.push(idx);
  });
  const instrMatches = [];
  INSTRUCTORS.forEach((ins, idx) => {
    const hay = (ins.name + ' ' + ins.region + ' ' + ins.state + ' ' + ins.zip).toLowerCase();
    if (hay.includes(q)) instrMatches.push(idx);
  });

  if (siteMatches.length === 0 && instrMatches.length === 0) {
    resultsEl.innerHTML = '<div class="combo-result-empty">No sites or instructors match “' + box.value + '”</div>';
  } else {
    let html = '';
    siteMatches.slice(0, 15).forEach(idx => {
      const s = DATA[idx];
      html += '<div class="combo-result-item" data-type="site" data-idx="' + idx + '"><b>' + s.name + '</b><span class="combo-tag site">Site</span></div>';
    });
    instrMatches.slice(0, 15).forEach(idx => {
      const ins = INSTRUCTORS[idx];
      html += '<div class="combo-result-item" data-type="instructor" data-idx="' + idx + '"><b>' + ins.name + ' — ' + ins.region + '</b><span class="combo-tag instructor">Instructor</span></div>';
    });
    resultsEl.innerHTML = html;
    resultsEl.querySelectorAll('.combo-result-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const type = el.getAttribute('data-type');
        if (type === 'site') selectSite(idx); else selectInstructorResult(idx);
      });
    });
  }
  resultsEl.classList.add('open');
}

function selectSite(idx){
  const s = DATA[idx];
  const marker = siteMarkers[idx];
  map.flyTo({ center: [s.lon, s.lat], zoom: 14, essential: true });
  if (!marker.getPopup().isOpen()) marker.togglePopup();
  document.getElementById('comboResults').classList.remove('open');
  document.getElementById('comboSearch').value = s.name;
}

function selectInstructorResult(idx){
  const ins = INSTRUCTORS[idx];
  const marker = instructorMarkers[idx];
  const cb = document.getElementById('toggleInstructors');
  if (!cb.checked) { cb.checked = true; toggleInstructorLayer(); }
  map.flyTo({ center: [ins.lon, ins.lat], zoom: 14, essential: true });
  if (!marker.getPopup().isOpen()) marker.togglePopup();
  document.getElementById('comboResults').classList.remove('open');
  document.getElementById('comboSearch').value = ins.name;
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.combo-search-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('comboResults').classList.remove('open');
  }
});

function toggleInstructorLayer(){
  const cb = document.getElementById('toggleInstructors');
  instructorMarkers.forEach(m => { if (cb.checked) m.addTo(map); else m.remove(); });
}

if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 40, maxZoom: 12, duration: 0 });

// ---- LIST ----
function renderList(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const stateF = document.getElementById('stateFilter').value;
  const statusF = document.getElementById('statusFilter').value;

  // group by region+state
  const groups = {};
  DATA.forEach(s => {
    if (stateF && s.state !== stateF) return;
    if (statusF === 'open' && !siteHasOpen(s)) return;
    if (statusF === 'filled' && !siteAllFilled(s)) return;

    const searchable = [s.name, s.city, s.region, s.state, ...s.classes.map(c => c.program + ' ' + (c.course||''))].join(' ').toLowerCase();
    if (q && !searchable.includes(q)) return;

    const key = s.region + '|' + s.state;
    groups[key] = groups[key] || [];
    groups[key].push(s);
  });

  const keys = Object.keys(groups).sort((a,b) => a.localeCompare(b));
  const main = document.getElementById('mainList');
  if (keys.length === 0) {
    main.innerHTML = '<p style="color:var(--muted);margin-top:30px;">No sites match your filters.</p>';
    return;
  }

  let out = '';
  keys.forEach(key => {
    const [region, state] = key.split('|');
    const sites = groups[key].sort((a,b) => a.name.localeCompare(b.name));
    const openTotal = sites.reduce((n,s) => n + s.classes.filter(c=>c.status==='open').length, 0);
    const filledTotal = sites.reduce((n,s) => n + s.classes.filter(c=>c.status==='filled').length, 0);

    out += `<div class="region-block">
      <div class="region-title">${region} <span class="state-tag">${state}</span>
      <span class="count">${sites.length} site${sites.length!==1?'s':''} · ${openTotal} open · ${filledTotal} filled</span></div>
      <div class="site-grid">`;

    sites.forEach(s => {
      const hasOpen = siteHasOpen(s);
      const openClasses = s.classes.filter(c => c.status === 'open');
      const filledClasses = s.classes.filter(c => c.status === 'filled');
      const cardClasses = ['site-card', hasOpen ? '' : 'no-open', filledClasses.length > 0 ? 'filled-hover-wrap' : ''].filter(Boolean).join(' ');

      out += `<div class="${cardClasses}">
        <div class="site-name">📍 ${s.name}</div>
        <div class="site-loc">${s.city}, ${s.state} &middot; ${s.address} ${s.zip}</div>`;

      openClasses.forEach(c => {
        const timeTxt = c.time ? ` <span style="color:var(--muted);font-size:11px;">(${c.time})</span>` : '';
        out += `<div class="class-row"><span class="prog">📘 ${c.program}</span>${c.course ? ' — ' + c.course : ''}${timeTxt}<span class="badge open">OPEN</span></div>`;
      });

      const filledDetailsHtml = filledClasses.map(c => {
        const timeTxt = c.time ? ` <span style="color:var(--muted);">(${c.time})</span>` : '';
        return `<div class="filled-detail-row"><b>${c.program}</b>${c.course ? ' — ' + c.course : ''}${timeTxt} · <span style="color:var(--filled);">${c.instructor || 'Filled'}</span></div>`;
      }).join('');

      if (openClasses.length === 0 && filledClasses.length > 0) {
        out += `<div class="no-open-note">No open placements — fully staffed (${filledClasses.length} class${filledClasses.length!==1?'es':''})<span class="hint">hover for details</span></div>`;
      } else if (filledClasses.length > 0) {
        out += `<div class="class-row filled">+ ${filledClasses.length} filled class${filledClasses.length!==1?'es':''} at this site<span class="hint">hover for details</span></div>`;
      }
      if (filledClasses.length > 0) {
        out += `<div class="filled-details">${filledDetailsHtml}</div>`;
      }
      out += `</div>`;
    });

    out += `</div></div>`;
  });

  main.innerHTML = out;
}
renderList();
</script>
